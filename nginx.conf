server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_http_version 1.1;
    gzip_disable "msie6";
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;
    gzip_comp_level 6;

    # SPA support (routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Widget location with CORS
    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Widget chunks must not be cached during development: the entry bundle
        # and async chunks are rebuilt together and must always stay in sync.
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /widget/marusya-widget.js {
        alias /usr/share/nginx/html/widget/marusya-widget.js;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Pragma 'no-cache' always;
        expires off;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}

