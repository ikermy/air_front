name: Deploy AirFront Production
on:
  push:
    branches:
      - master
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            LAND_URL=https://${{ vars.DOMAIN }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/airfront:prod
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "air-front-prod.yml"
          target: "/bot/marusia/air_front"
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /bot/marusia/air_front
            # Login to GHCR on remote server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Set application environment variables
            export DOCKER_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/airfront:prod
            export DOMAIN=${{ vars.DOMAIN }}
            # Deploy application
            docker compose -f air-front-prod.yml pull
            docker compose -f air-front-prod.yml up -d
            # Cleanup
            docker image prune -f

